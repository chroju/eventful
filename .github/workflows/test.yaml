name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      # DEBUG: narrowing down a hang. CLITests and SpoolTests don't spawn a
      # Process; RunnerTests does. If this step passes but the full suite
      # hangs, the hang is in Process/waitUntilExit under the CI sandbox.
      - run: swift test --verbose --filter 'CLITests|SpoolTests'
        timeout-minutes: 3
