name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      # --no-parallel: RunnerTests and WrapTests are each .serialized, but
      # serialization is per-suite — the two suites still run concurrently
      # with each other, and concurrent Process spawns hang indefinitely on
      # GitHub Actions macOS runners (the suites pass in seconds with
      # --no-parallel). Not reproducible locally.
      - run: swift test --no-parallel
        timeout-minutes: 5
