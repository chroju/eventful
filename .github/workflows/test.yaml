name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      # DEBUG: CLITests/SpoolTests (no Process) passed instantly. Narrowing
      # further within RunnerTests: successfulCommand is the simplest
      # Process-spawning test (no pipe reads beyond EOF, no timeout kill).
      - run: swift test --verbose --filter 'successfulCommand'
        timeout-minutes: 2
