name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      # DEBUG: successfulCommand and stderrTailIsLastLine both passed. Only
      # remaining candidate: timeoutKillsProcess (terminate()/SIGKILL path).
      - run: swift test --verbose --filter 'timeoutKillsProcess'
        timeout-minutes: 2
