name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      # DEBUG: successfulCommand passed. Next isolate: stderr pipe reading
      # (stderrTailIsLastLine) without any timeout-kill path.
      - run: swift test --verbose --filter 'stderrTailIsLastLine'
        timeout-minutes: 2
